spring.application.name=ApiGateway

server.port=8888
 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
 
spring.cloud.gateway.routes[0].id=NotificationMicroservice
spring.cloud.gateway.routes[0].uri=http://localhost:8003
spring.cloud.gateway.routes[0].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[1].id=InventoryMicroservice
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/inventory/**
 
[/**].allowedMethods=GET,POST,PUT,DELETE